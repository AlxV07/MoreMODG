<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MODG Weekly Work</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <div class="brand">MoreMODG</div>
    <p class="intro">Click 'Setup' to confirm this is your student home page and to enable MoreMODG enhancements.</p>
    <button id="setup" class="button">Setup</button>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="saved" class="saved hidden"></div>
    <div id="enhancements" class="enhancements hidden">
      <div class="enhancements-title">Enhancements enabled</div>
      <ul>
        <li>Home Page: Unified Syllabus panel</li>
        <li>Syllabi Pages: Jump to Today buttons</li>
        <li>Student Work Page: Expanded course filtering interface</li>
      </ul>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
